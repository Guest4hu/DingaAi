spring.application.name=dinga-ai
server.port=${PORT:8080}

# Provedor LLM híbrido: auto | gemini | groq | openai | ollama | local
dinga.llm.provider=${DINGA_LLM_PROVIDER:auto}
dinga.llm.gemini-api-key=${GEMINI_API_KEY:}
dinga.llm.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
dinga.rag.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
dinga.llm.groq-api-key=${GROQ_API_KEY:}
dinga.llm.groq-model=${GROQ_MODEL:llama-3.1-8b-instant}
dinga.llm.openai-api-key=${OPENAI_API_KEY:}
dinga.llm.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
dinga.llm.openai-model=${OPENAI_MODEL:gpt-4o-mini}
dinga.llm.ollama-url=${OLLAMA_URL:}
dinga.llm.ollama-model=${OLLAMA_MODEL:llama3.2}

# Persistência local em JSON (RAG docente, Quiz gerado e Auditoria MTG-IA)
dinga.storage.dir=${DINGA_DATA_DIR:data}

# Upload de arquivos RAG (.md / .txt)
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=1MB

# Rate limiting leve (proteção contra rajadas em /api/chat, /api/chat/stream, /api/tts, /api/quiz/generate, /api/simulator)
dinga.rate-limit.enabled=${DINGA_RATE_LIMIT_ENABLED:true}
dinga.rate-limit.trust-proxy=${DINGA_RATE_LIMIT_TRUST_PROXY:false}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
